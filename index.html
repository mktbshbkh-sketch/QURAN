<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>بحث في القرآن الكريم</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0E3B2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="بحث قرآني">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#F6F1E4;
    --parchment-deep:#EFE7D2;
    --ink:#26241C;
    --ink-soft:#5B5747;
    --emerald:#0E3B2E;
    --emerald-light:#155645;
    --gold:#B7902E;
    --gold-soft:#E4CE94;
    --line:#DDD3B4;
    --danger:#8C3B2E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--parchment);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:40px 20px 80px;
  }
  header{
    text-align:center;
    margin-bottom:36px;
  }
  .ornament{
    color:var(--gold);
    font-size:22px;
    letter-spacing:6px;
    margin-bottom:6px;
  }
  h1{
    font-family:'Amiri',serif;
    font-weight:700;
    font-size:38px;
    color:var(--emerald);
    margin:0 0 6px;
  }
  .subtitle{
    color:var(--ink-soft);
    font-size:15px;
    margin:0;
  }
  .search-box{
    position:relative;
    margin-bottom:14px;
  }
  input[type="text"]{
    width:100%;
    padding:16px 56px 16px 20px;
    font-size:20px;
    font-family:'Amiri',serif;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:#fff;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  input[type="text"]:focus{
    border-color:var(--emerald-light);
  }
  input[type="text"]::placeholder{
    font-family:'Tajawal',sans-serif;
    font-size:15px;
    color:#A8A28B;
  }
  .search-icon{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    color:var(--ink-soft);
    font-size:18px;
    pointer-events:none;
  }
  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:24px;
    min-height:18px;
  }
  .status{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
    font-size:15px;
    display:none;
  }
  .status.show{display:block;}
  .status.error{color:var(--danger);}
  .results{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .ayah-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    padding:22px 24px;
    position:relative;
  }
  .ayah-card::before{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    right:0;
    width:4px;
    background:var(--gold);
    border-radius:0 12px 12px 0;
  }
  .ayah-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:12px;
    font-size:13px;
    color:var(--emerald);
  }
  .surah-name{
    font-weight:700;
  }
  .ayah-loc{
    color:var(--ink-soft);
    direction:ltr;
    unicode-bidi:isolate;
  }
  .ayah-text{
    font-family:'Amiri',serif;
    font-size:26px;
    line-height:2.1;
    color:var(--ink);
  }
  .ayah-text mark{
    background:var(--gold-soft);
    color:var(--emerald);
    padding:0 2px;
    border-radius:3px;
  }
  .empty-hint{
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    padding:50px 20px;
    line-height:1.9;
  }
  .empty-hint .big{
    font-family:'Amiri',serif;
    font-size:20px;
    color:var(--emerald);
    display:block;
    margin-bottom:10px;
  }
  footer{
    text-align:center;
    margin-top:50px;
    font-size:12px;
    color:#A8A28B;
  }
  @media (max-width:480px){
    h1{font-size:30px;}
    .ayah-text{font-size:22px;}
    .ayah-card{padding:18px 16px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ornament">۞</div>
    <h1>البحث في القرآن الكريم</h1>
    <p class="subtitle">اكتب كلمة أو عبارة للبحث عنها في آيات القرآن</p>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="مثال: الصبر، الرحمة، يا أيها الذين آمنوا" autofocus>
    <span class="search-icon">🔍</span>
  </div>
  <div class="meta-row">
    <span id="resultCount"></span>
    <span id="loadingLabel"></span>
  </div>

  <div class="status" id="statusBox"></div>

  <div class="empty-hint" id="emptyHint">
    <span class="big">ابدأ بالبحث</span>
    اكتب أي كلمة عربية في المربع أعلاه وسيظهر لك كل موضع ورد فيه هذا اللفظ في القرآن الكريم، مع اسم السورة ورقم الآية.
  </div>

  <div class="results" id="results"></div>

  <footer>البيانات مستخرجة من alquran.cloud — نص القرآن الكريم دون تشكيل</footer>
</div>

<script>
const input = document.getElementById('searchInput');
const resultsEl = document.getElementById('results');
const statusBox = document.getElementById('statusBox');
const emptyHint = document.getElementById('emptyHint');
const resultCount = document.getElementById('resultCount');
const loadingLabel = document.getElementById('loadingLabel');

let debounceTimer = null;
let currentRequestId = 0;

function escapeHtml(str){
  return str.replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function highlight(text, term){
  const escaped = escapeHtml(text);
  if(!term) return escaped;
  const escapedTerm = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('(' + escapedTerm + ')', 'g');
  return escaped.replace(re, '<mark>$1</mark>');
}

function setStatus(message, isError){
  statusBox.textContent = message;
  statusBox.classList.toggle('show', !!message);
  statusBox.classList.toggle('error', !!isError);
}

function renderResults(matches, term){
  resultsEl.innerHTML = '';
  const frag = document.createDocumentFragment();
  matches.forEach(m => {
    const card = document.createElement('div');
    card.className = 'ayah-card';
    card.innerHTML = `
      <div class="ayah-header">
        <span class="surah-name">${escapeHtml(m.surah.name)}</span>
        <span class="ayah-loc">آية ${m.numberInSurah} — سورة ${m.surah.number}</span>
      </div>
      <div class="ayah-text">${highlight(m.text, term)}</div>
    `;
    frag.appendChild(card);
  });
  resultsEl.appendChild(frag);
}

async function runSearch(term){
  const requestId = ++currentRequestId;
  emptyHint.style.display = 'none';
  resultsEl.innerHTML = '';
  resultCount.textContent = '';
  loadingLabel.textContent = 'جارٍ البحث…';
  setStatus('', false);

  try{
    const url = 'https://api.alquran.cloud/v1/search/' + encodeURIComponent(term) + '/all/quran-simple';
    const res = await fetch(url);
    const data = await res.json();

    if(requestId !== currentRequestId) return;
    loadingLabel.textContent = '';

    if(data.code === 200 && data.data && data.data.count > 0){
      resultCount.textContent = 'عدد النتائج: ' + data.data.count;
      renderResults(data.data.matches, term);
    } else {
      resultCount.textContent = '';
      setStatus('لم يتم العثور على نتائج لكلمة "' + term + '"', false);
    }
  } catch(err){
    if(requestId !== currentRequestId) return;
    loadingLabel.textContent = '';
    resultCount.textContent = '';
    setStatus('تعذر إتمام البحث. تأكد من اتصالك بالإنترنت وحاول مرة أخرى.', true);
  }
}

input.addEventListener('input', () => {
  const term = input.value.trim();
  clearTimeout(debounceTimer);

  if(!term){
    resultsEl.innerHTML = '';
    resultCount.textContent = '';
    loadingLabel.textContent = '';
    setStatus('', false);
    emptyHint.style.display = 'block';
    return;
  }

  if(term.length < 2){
    return;
  }

  debounceTimer = setTimeout(() => runSearch(term), 450);
});

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
